# Local PostgreSQL and OpenSearch for development and e2e tests.
#   docker compose up -d --wait
# Matches ConnectionStrings:Default in src/AutoMotivePriceTracker.Web/appsettings.Development.json.
services:
  postgres:
    image: postgres:17
    container_name: autoprice-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: autoprice
    ports:
      - "5432:5432"
    volumes:
      - autoprice-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d autoprice"]
      interval: 2s
      timeout: 3s
      retries: 30

  # OpenSearch (API-compatible with the Elasticsearch features we use; same engine as Amazon OpenSearch Service).
  # Single-node, security off: development only. Matches Search:Url (default http://localhost:9200).
  opensearch:
    image: opensearchproject/opensearch:2.19.1
    container_name: autoprice-opensearch
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - autoprice-osdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  autoprice-pgdata:
  autoprice-osdata:
